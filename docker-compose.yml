services:
  # Kafka-compatible message broker. Holds trades between the producer and Spark.
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: redpanda
    command:
      - redpanda
      - start
      # Two listeners: one for containers on Docker's network, one for your own machine
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1            # 1 CPU core
      - --memory 1G        # 1 GB of RAM
      - --mode dev-container
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data   # messages survive `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped   # come back after a VM reboot

  # Runs once: creates the topic, then exits.
  # 3 partitions; trades are kept 1 day (~1.5 GB raw), so the VM disk doesn't fill up.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - rpk topic create ${KAFKA_TOPIC:-crypto_trades} -p 3 -c retention.ms=86400000 -X brokers=redpanda:9092 || true
    restart: "no"

  # Binance -> Kafka. Starts once the topic exists; restarts itself if it crashes.
  producer:
    build: ./producer
    container_name: producer
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-crypto_trades}
      SYMBOLS: ${SYMBOLS}
      BINANCE_WS_BASE: ${BINANCE_WS_BASE:-wss://data-stream.binance.vision}
    restart: unless-stopped

  # Kafka -> 1-minute candles -> Parquet in the data lake.
  # Logs in to the lake as the crypto-pipeline service principal (values from .env).
  spark:
    build: ./streaming
    container_name: spark
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-crypto_trades}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_CONTAINER: ${AZURE_CONTAINER:-lake}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
    ports:
      - "4040:4040"   # Spark UI: http://localhost:4040
    restart: unless-stopped

  # Web UI for browsing topics, partitions and messages: http://localhost:8080
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  redpanda-data:
